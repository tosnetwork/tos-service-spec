syntax = "proto3";

package atos.tos.v1;

option go_package = "github.com/tosnetwork/atos-spec/proto/atos/tos/v1;atostosv1";

import "atos/tos/v1/common.proto";

// IdentityService is implemented by tos-protocol/tos-core. It exposes
// resolvable identity facts without leaking wallet derivation or node topology.
//
// Phase 4A adds CreatePrincipalBinding/RevokePrincipalBinding: gateway-mediated,
// operator-authorized binding mutations. Creating a brand-new AgentIdentity from
// nothing remains an out-of-band operator/bootstrap action (not exposed here) --
// CreatePrincipalBinding only binds a principal to an AgentIdentity that already
// independently resolves via ResolveAgentIdentity, so a binding call can never
// itself conjure an identity's existence. Full self-service, wallet-proved Agent
// Identity creation and rotation is Phase 5 Wallet-Native's deliverable
// (docs/IMPLEMENTATION_ROADMAP.md §9), not this phase's.
service IdentityService {
  rpc ResolveAgentIdentity(ResolveAgentIdentityRequest) returns (ResolveAgentIdentityResponse);
  rpc ResolvePrincipalBinding(ResolvePrincipalBindingRequest) returns (ResolvePrincipalBindingResponse);
  rpc CreatePrincipalBinding(CreatePrincipalBindingRequest) returns (CreatePrincipalBindingResponse);
  rpc RevokePrincipalBinding(RevokePrincipalBindingRequest) returns (RevokePrincipalBindingResponse);
}

message AgentIdentity {
  string agent_id = 1;
  string canonical_uri = 2;
  repeated string controllers = 3;
  string assurance = 4; // self_asserted / atos_verified / tos_attested / stronger future values
  NetworkReference identity_ref = 5;
  int64 updated_unix_millis = 6;
  map<string, string> public_attributes = 7;
}

message ResolveAgentIdentityRequest {
  RequestContext context = 1;
  string agent_id = 2;
  string canonical_uri = 3;
}

message ResolveAgentIdentityResponse {
  AgentIdentity identity = 1;
  bool found = 2;
}

// Principal bindings let an ATOS account resolve to a TOS Agent Identity
// without requiring the consumer to expose or manage a wallet key.
message ResolvePrincipalBindingRequest {
  RequestContext context = 1;
  string principal_id = 2;
}

message ResolvePrincipalBindingResponse {
  string principal_id = 1;
  AgentIdentity identity = 2;
  bool bound = 3;
  NetworkReference binding_ref = 4;
  // status/revocation_reason_code let a caller distinguish "never bound"
  // (bound=false, status=PRINCIPAL_BINDING_STATUS_UNSPECIFIED) from
  // "was bound, now revoked" (bound=false, status=PRINCIPAL_BINDING_STATUS_REVOKED)
  // -- the latter must fail closed exactly like the former for any authority
  // decision, but an operator surface needs the distinction for audit/UX.
  PrincipalBindingStatus status = 5;
  string revocation_reason_code = 6;
}

enum PrincipalBindingStatus {
  PRINCIPAL_BINDING_STATUS_UNSPECIFIED = 0;
  PRINCIPAL_BINDING_STATUS_ACTIVE = 1;
  PRINCIPAL_BINDING_STATUS_REVOKED = 2;
}

// CreatePrincipalBinding durably, idempotently anchors a binding from an
// ATOS-local principal_id to an already-existing AgentIdentity (verified
// server-side by resolving agent_id before binding -- a caller cannot bind a
// principal to an identity that does not independently resolve). This is a
// gateway-operator action, not ordinary self-service authorization: the
// caller_id in context is the operating ATOS backend's own trusted identity,
// not the end user the binding is being created for -- see atos-spec
// docs/AUTH.md's "Agent Identity Migration" (this binding is server-side by
// default) and docs/IMPLEMENTATION_ROADMAP.md Phase 4A's admin-scope
// requirement enforced at the ATOS REST/MCP layer, one level above this RPC.
//
// Idempotency: identical (principal_id, agent_id, idempotency_key) replays
// the original result, including after the principal was later revoked and
// rebound to a DIFFERENT agent_id under a fresh idempotency_key -- reusing an
// idempotency_key already consumed by a different agent_id (or a different
// principal_id) is ALREADY_EXISTS, never a silent rebind.
message CreatePrincipalBindingRequest {
  RequestContext context = 1;
  string principal_id = 2;
  string agent_id = 3;
}

message CreatePrincipalBindingResponse {
  string principal_id = 1;
  AgentIdentity identity = 2;
  NetworkReference binding_ref = 3;
  bool created = 4; // false on an idempotent replay of an already-completed binding
}

// RevokePrincipalBinding ends a principal's current binding. It does not
// rewrite or invalidate facts (Quotes, Jobs, manifest/ownership commitments)
// that were already anchored while the binding was active -- those remain
// historically valid for the network/time they were made under. Future
// ActivationAuthority evaluations that depend on this principal's current
// TOS Agent Identity MUST observe bound=false (or status=REVOKED) after this
// call and fail closed / suspend accordingly (see docs/CAPABILITIES.md §15
// invariant 11: no silent downgrade -- suspension through the legal
// mode_support state machine, never a downgrade to Managed).
message RevokePrincipalBindingRequest {
  RequestContext context = 1;
  string principal_id = 2;
  string reason_code = 3;
}

message RevokePrincipalBindingResponse {
  bool revoked = 1; // false if there was no active binding to revoke (not an error)
  NetworkReference revocation_ref = 2;
}
